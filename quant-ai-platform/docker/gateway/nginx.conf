worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  map $http_x_trace_id $quant_trace_id {
    default $http_x_trace_id;
    "" $request_id;
  }

  log_format quant_json escape=json
    '{"ts":"$time_iso8601",'
    '"service":"gateway",'
    '"traceId":"$quant_trace_id",'
    '"requestId":"$request_id",'
    '"remoteAddr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"requestTime":$request_time,'
    '"upstreamAddr":"$upstream_addr",'
    '"upstreamStatus":"$upstream_status",'
    '"upstreamTime":"$upstream_response_time"}';

  access_log /var/log/nginx/access.log quant_json;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  limit_req_zone $binary_remote_addr zone=ip_api_rate:10m rate=30r/s;
  limit_req_zone $http_x_user_id zone=user_api_rate:10m rate=8r/s;

  upstream research_task_upstream {
    server research-task-service:8081 max_fails=3 fail_timeout=20s;
    keepalive 32;
  }

  upstream ai_orchestration_upstream {
    server ai-orchestration-service:8082 max_fails=3 fail_timeout=20s;
    keepalive 32;
  }

  upstream ai_engine_upstream {
    server ai-engine-worker:8090 max_fails=3 fail_timeout=20s;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $quant_trace_id;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 45s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /health {
      access_log off;
      add_header Content-Type application/json;
      add_header X-Trace-Id $quant_trace_id;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location = /nginx_status {
      access_log off;
      stub_status;
      allow 172.0.0.0/8;
      allow 127.0.0.1;
      deny all;
    }

    location /api/research/ {
      limit_req zone=ip_api_rate burst=60 nodelay;
      limit_req zone=user_api_rate burst=20 nodelay;
      proxy_pass http://research_task_upstream;
    }

    location = /api/tasks {
      limit_req zone=ip_api_rate burst=80 nodelay;
      limit_req zone=user_api_rate burst=30 nodelay;
      proxy_pass http://ai_orchestration_upstream;
    }

    location /api/tasks/ {
      limit_req zone=ip_api_rate burst=80 nodelay;
      limit_req zone=user_api_rate burst=30 nodelay;
      proxy_pass http://ai_orchestration_upstream;
    }

    location /api/ {
      limit_req zone=ip_api_rate burst=80 nodelay;
      limit_req zone=user_api_rate burst=30 nodelay;
      proxy_pass http://ai_orchestration_upstream;
    }

    location /engine/ {
      limit_req zone=ip_api_rate burst=30 nodelay;
      rewrite ^/engine/(.*)$ /$1 break;
      proxy_pass http://ai_engine_upstream;
    }
  }
}

name: quant-ai-platform

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: quant-gateway
    restart: unless-stopped
    profiles: ["runtime", "observability"]
    depends_on:
      ai-orchestration-service:
        condition: service_healthy
      research-task-service:
        condition: service_healthy
      ai-engine-worker:
        condition: service_healthy
      ai-engine-consumer:
        condition: service_healthy
    ports:
      - "18080:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q 'gateway'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - quant_net

  ai-orchestration-service:
    build:
      context: ../../quant-services
      dockerfile: quant-business/ai-orchestration-service/Dockerfile
    image: quant-ai-orchestration-service:phase-017
    container_name: quant-ai-orchestration-service
    restart: unless-stopped
    profiles: ["runtime", "observability"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      QUANT_SERVICE_ACTOR_SECRET: ${QUANT_SERVICE_ACTOR_SECRET:-local-dev-service-actor-secret}
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - quant_net

  research-task-service:
    build:
      context: ../../quant-services
      dockerfile: quant-business/research-task-service/Dockerfile
    image: quant-research-task-service:phase-017
    container_name: quant-research-task-service
    restart: unless-stopped
    profiles: ["runtime", "observability"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      QUANT_SERVICE_ACTOR_SECRET: ${QUANT_SERVICE_ACTOR_SECRET:-local-dev-service-actor-secret}
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - quant_net

  ai-engine-worker:
    build:
      context: ../../quant-ai-engine
      dockerfile: Dockerfile
    image: quant-ai-engine-worker:phase-017
    container_name: quant-ai-engine-worker
    restart: unless-stopped
    profiles: ["runtime", "observability"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ai-orchestration-service:
        condition: service_healthy
    environment:
      QUANT_AI_PROFILE: docker
      TZ: Asia/Shanghai
    command: ["python", "-m", "app.http_server"]
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health | grep -q 'quant-ai-engine'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - quant_net

  ai-engine-consumer:
    build:
      context: ../../quant-ai-engine
      dockerfile: Dockerfile
    image: quant-ai-engine-worker:phase-017
    container_name: quant-ai-engine-consumer
    restart: unless-stopped
    profiles: ["runtime", "observability"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ai-orchestration-service:
        condition: service_healthy
    environment:
      QUANT_AI_PROFILE: docker
      TZ: Asia/Shanghai
    command: ["python", "-m", "app.consumer_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.consumer_healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - quant_net

  mysql:
    image: mysql:8.0
    container_name: quant-mysql
    restart: unless-stopped
    profiles: ["infra", "runtime", "observability"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quant_ai
      MYSQL_USER: quant
      MYSQL_PASSWORD: quant123
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - quant_net

  redis:
    image: redis:7.4
    container_name: quant-redis
    restart: unless-stopped
    profiles: ["infra", "runtime", "observability"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - quant_net

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9
    container_name: quant-zookeeper
    restart: unless-stopped
    profiles: ["infra", "runtime", "observability"]
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - quant_net

  kafka:
    image: bitnamilegacy/kafka:3.9
    container_name: quant-kafka
    restart: unless-stopped
    profiles: ["infra", "runtime", "observability"]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "19092:19092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@quant-kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://quant-kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnamilegacy/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - quant_net

  kafka-init:
    image: bitnamilegacy/kafka:3.9
    container_name: quant-kafka-init
    profiles: ["infra", "runtime", "observability"]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../scripts/create-topics.sh:/opt/quant/create-topics.sh:ro
    command: ["/bin/sh", "/opt/quant/create-topics.sh"]
    networks:
      - quant_net

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: quant-nacos
    restart: unless-stopped
    profiles: ["infra", "runtime", "observability"]
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health | grep -q 'UP'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - quant_net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: quant-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      gateway:
        condition: service_healthy
      ai-orchestration-service:
        condition: service_healthy
      research-task-service:
        condition: service_healthy
      ai-engine-worker:
        condition: service_healthy
      ai-engine-consumer:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - quant_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: quant-alertmanager
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9093:9093"
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - quant_net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: quant-grafana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - quant_net

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: quant-kafka-exporter
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    ports:
      - "9308:9308"
    networks:
      - quant_net

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: quant-redis-exporter
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - quant_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: quant-nginx-exporter
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      gateway:
        condition: service_healthy
    command:
      - --nginx.scrape-uri=http://gateway/nginx_status
    ports:
      - "9113:9113"
    networks:
      - quant_net

networks:
  quant_net:
    driver: bridge
    name: compose_quant_net

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  nacos_data:
  nacos_logs:
  prometheus_data:
  alertmanager_data:
  grafana_data:

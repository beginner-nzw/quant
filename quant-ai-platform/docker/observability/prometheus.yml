global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: quant-ai-platform
    environment: docker

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: nginx-exporter
    static_configs:
      - targets:
          - nginx-exporter:9113
        labels:
          service: gateway

  - job_name: ai-orchestration-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ai-orchestration-service:8082
        labels:
          service: ai-orchestration-service

  - job_name: research-task-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - research-task-service:8081
        labels:
          service: research-task-service

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - user-service:8080
        labels:
          service: user-service

  - job_name: subscription-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - subscription-service:8088
        labels:
          service: subscription-service

  - job_name: ai-engine-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-engine-worker:8090
        labels:
          service: ai-engine-worker

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

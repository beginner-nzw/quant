groups:
  - name: quant-platform-baseline
    rules:
      - alert: QuantServiceDown
        expr: up{job=~"ai-orchestration-service|research-task-service|ai-engine-worker|kafka-exporter|redis-exporter|nginx-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Quant service is down"
          description: "{{ $labels.job }} has not been scraped successfully for more than 2 minutes."

      - alert: QuantJavaHighErrorRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum by (service) (rate(http_server_requests_seconds_count[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Java service 5xx ratio is high"
          description: "{{ $labels.service }} 5xx ratio is above 5% for 5 minutes."

      - alert: QuantAiEngineHighErrorRate
        expr: |
          sum(rate(ai_engine_tasks_total{status=~"failed|timeout"}[5m]))
          /
          clamp_min(sum(rate(ai_engine_tasks_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI engine failure ratio is high"
          description: "AI engine failed or timed out workflow ratio is above 5% for 5 minutes."

      - alert: QuantKafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "{{ $labels.consumergroup }} lag on {{ $labels.topic }} is above 500 for 10 minutes."

      - alert: QuantAiEngineObservedLagHigh
        expr: ai_engine_kafka_lag_messages > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI engine observed lag is high"
          description: "AI engine observed dispatch-topic lag is above 500 for 10 minutes."

      - alert: QuantRedisUnavailable
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter reports Redis unavailable"
          description: "Redis has been unavailable for more than 2 minutes."

      - alert: QuantRedisDegraded
        expr: ai_engine_redis_degraded == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI engine is running in Redis degraded mode"
          description: "Redis operations are failing and the worker is falling back to degraded behavior."

      - alert: QuantGatewayHighConnectionLoad
        expr: nginx_connections_active > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway active connections are elevated"
          description: "Nginx active connections are above 500 for 5 minutes."
